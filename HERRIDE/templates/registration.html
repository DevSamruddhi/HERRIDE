<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Register - Her Ride</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      #role2{
        background-color:#FFD700;
      }
      body {
        background: linear-gradient(135deg, #000000, #2C2C2C);
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        color: white;
      }
      #logo {
        font-family: 'Poppins', sans-serif;
        font-size: 50px;
        font-weight: bold;
        color: #FFD700;
        text-align: center;
        margin-top: 20px;
      }
      #info {
        max-width: 450px;
        margin: 50px auto;
        padding: 20px;
        background: #1E1E1E;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
        text-align: center;
      }
      h1, p {
        color: #FFD700;
      }
      input {
        width: calc(100% - 20px);
        padding: 10px;
        margin: 10px 0;
        border: 2px solid #FFD700;
        border-radius: 5px;
        font-size: 16px;
        background: black;
        color: white;
      }
      form button {
        width: 100%;
        background: #FFD700;
        color: black;
        padding: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 18px;
        transition: 0.3s;
      }
      form button:hover {
        background: #B8860B;
      }
      label {
        text-align:left;
        font-size: 14px;
        color: #FFD700;
      }
      footer {
        text-align: center;
        color: #FFD700;
        margin-top: 20px;
      }
      a {
        color: #FFD700;
      }
    </style>
  </head>
  <body>
    
    <header>
      <h1 id="logo">Her Ride</h1>
    </header>
    <main>
      <section id="info">
        <h1>Create an account</h1>
        <p>Please fill in all the necessary details!</p>
        {% if user %}
        <form action="{%url 'ulogin'%}" method="POST">
        {% elif driver %}
        <form action="{%url 'dlogin'%}" method="POST">
        {% endif %}
        {% csrf_token %}
          <label id="role">Select Role:</label>
          <select id="role2" name="role" required>
            <option value="user">User</option>
            <option value="driver">Driver</option>
          </select>
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="text" id="mobile" placeholder="Mobile Number" required>
          <input type="email" id="email" name="email" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" title="Email must be from gmail.com" placeholder="Email Address" required>
          <input type="password" id="password" name="password" placeholder="Password" minlength="8" maxlength="16" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=]).{8,}" title="Password must contain at least one uppercase letter, one lowercase letter, one number, and one special character (@#$%^&+=)." required>
          <label>
            <input type="checkbox" name="checkbox" required>I accept the <a href="{% url 'tandc'%}">terms and conditions</a>
          </label>
          <button type="submit">Proceed</button>
          <p>Already have an account? 
            {% if user %}
            <a href="{% url 'ulogin'%}">Login here</a>
            {% elif driver %}
            <a href="{% url 'dlogin'%}">Login here</a>
            {% endif %}
          </p>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Her Ride. All rights reserved.</p>
    </footer>
  </body>
</html>
